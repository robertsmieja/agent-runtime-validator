[package]
name = "agent-runtime-validator"
version = "0.2.0"
edition = "2021"
description = "Harness-agnostic validation gate for hardened agent runtime images"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"

[profile.release]
strip = true
lto = true
